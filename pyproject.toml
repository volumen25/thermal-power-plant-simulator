[project]
name = "thermal-power-plant-simulator"
version = "0.1.0"
description = "Python scripts for Thermal Power Plant Simulator course"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "seaborn",
]

# New recommended format for development dependencies
[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "pyyaml",
    "black",
    "pytest",
]