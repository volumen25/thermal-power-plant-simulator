[project]
name = "thermal-power-plant-simulator"
version = "0.1.0"
description = "Python scripts for Thermal Power Plant Simulator course"
requires-python = ">=3.14"
dependencies = [
    "iapws>=1.5.5",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
]

[dependency-groups]
dev = [
    "black",
    "ipykernel",
    "jupyter",
    "pytest",
    "pyyaml",
]

[tool.black]
target-version = ["py314"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]